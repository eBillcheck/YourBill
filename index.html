<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Billing</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --bg-color: #f0f4f8; 
            --container-bg: #ffffff; 
            --text-header: #102a43; 
            --text-body: #334e68;
            --accent: #0052cc; 
            --accent-hover: #003e99;
            --success: #00875a;
            --danger: #de350b;
            --warning: #ff991f;
            --border: #d9e2ec;
        }
        [data-theme="dark"] { 
            --bg-color: #121212; 
            --container-bg: #1e1e1e; 
            --text-header: #ffffff; 
            --text-body: #e0e0e0;
            --accent: #4c9aff; 
            --border: #333333;
        }
        
        body { 
            background-color: var(--bg-color); 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.3s, color 0.3s; 
            margin: 0; 
            color: var(--text-body); 
            padding: 15px 3%; 
        }
        
        .header-3d { 
            text-align: center; 
            font-size: clamp(22px, 5vw, 36px); 
            font-weight: 800; 
            color: var(--text-header);
            margin-bottom: 15px; 
            letter-spacing: -0.5px;
        }
        
        .lang-btn-container { text-align: center; margin-bottom: 20px; }
        .btn-lang-big { 
            background: var(--accent); 
            color: white; 
            padding: 8px 24px; 
            border-radius: 50px; 
            font-weight: 600; 
            border: none; 
            cursor: pointer; 
            font-size: 14px; 
            box-shadow: 0 4px 10px rgba(0, 82, 204, 0.2); 
            transition: all 0.2s ease; 
        }
        .btn-lang-big:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0, 82, 204, 0.3); }

        .nav-container { 
            max-width: 1200px; 
            margin: 0 auto 20px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 10px; 
            background: var(--container-bg);
            padding: 8px 15px; 
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }
        
        #syncIcon {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
            user-select: none;
        }

        .nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        
        .btn-blue { 
            background: var(--accent); 
            color: white; 
            padding: 7px 14px; 
            border-radius: 6px; 
            font-weight: 600; 
            border: none; 
            cursor: pointer; 
            font-size: 12px; 
            transition: opacity 0.2s;
        }
        .btn-blue:hover { opacity: 0.9; }

        #adminPanel { display: none; }
        
        .admin-panel { 
            max-width: 1200px; 
            margin: 0 auto 25px auto; 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 12px; 
            border: 1px solid var(--border);
        }
        
        .admin-panel input, .admin-panel select { 
            padding: 10px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            background: var(--bg-color); 
            color: var(--text-header); 
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-panel input:focus, .admin-panel select:focus {
            border-color: var(--accent);
        }

        .bill-container { 
            max-width: 1200px; 
            margin: 20px auto; 
            background: var(--container-bg); 
            padding: 0; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .month-header { 
            padding: 15px 20px; 
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .month-header h2 { margin: 0; color: var(--text-header); font-size: 18px; font-weight: 700; }
        .month-date-sub { font-size: 12px; color: #7f8c8d; font-weight: 600; }
        
        .table-wrapper { overflow-x: auto; padding: 0 20px 20px 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; margin-top: 10px; }
        thead tr { background: transparent; }
        th { 
            padding: 12px 10px; 
            color: #627d98; 
            font-weight: 600; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            border-bottom: 2px solid var(--border);
            text-align: left;
        }
        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid var(--border); 
            font-size: 13px; 
            color: var(--text-header);
            text-align: left;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        
        .status-pill { 
            padding: 5px 10px; 
            border-radius: 20px; 
            font-size: 10px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            display: inline-block;
            text-align: center;
        }
        .status-paid { background: #e3fcef; color: var(--success); }
        .status-unpaid { background: #ffebe6; color: var(--danger); }
        .status-partial { background: #fffae6; color: var(--warning); }
        
        .sub-text { font-size: 11px; display: block; margin-top: 4px; font-weight: 600; }
        
        /* Modals */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(16, 42, 67, 0.7); 
            backdrop-filter: blur(4px);
            align-items: center; justify-content: center; z-index: 9999; 
            opacity: 0; transition: opacity 0.3s;
        }
        .modal.active { opacity: 1; }
        
        .modal-box { 
            background: var(--container-bg); 
            padding: 25px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 320px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal.active .modal-box { transform: translateY(0); }
        
        .modal-box h3 { margin-top: 0; color: var(--text-header); margin-bottom: 8px; font-size:18px;}
        .modal-input {
            width: 100%; padding: 10px; margin: 8px 0; 
            border: 1px solid var(--border); border-radius: 6px;
            box-sizing: border-box; background: var(--bg-color); color: var(--text-header);
            font-family: inherit;
        }
        .modal-input:focus { border-color: var(--accent); outline: none; }
        
        .no-print { display: block; }
        .only-print { display: none; }
        
        /* Action buttons in table */
        .action-btns { display: flex; gap: 5px; }
        .btn-icon {
            padding: 5px 8px; border-radius: 4px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s;
        }

        /* Loading Spinner */
        #dataLoader {
            text-align: center;
            padding: 40px 20px;
            color: var(--accent);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
    </style>
</head>
<body onload="setupYearMonth()">

    <h1 class="header-3d no-print" id="mainTitle">Electricity Billing</h1>
    
    <div class="lang-btn-container no-print">
        <button class="btn-lang-big" onclick="toggleLanguage()" id="langBtn">हिंदी</button>
    </div>

    <!-- Nav bar -->
    <div class="nav-container no-print">
        <span id="syncIcon" title="Sync Status">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span id="syncText">Cloud Linked</span>
        </span>
        <div class="nav-actions">
            <button class="btn-blue" onclick="toggleTheme()" style="background:#627d98;" id="themeBtn">🌓 Theme</button>
            <a href="Pre.html" class="btn-blue" style="text-decoration:none; background:#829ab1;" id="historyBtn">↺ History</a>
            
            <!-- Login Button with Lock Icon -->
            <button class="btn-blue" id="loginBtn" onclick="triggerGoogleLogin()" style="background:var(--danger);">🔒 Login</button>
            
            <!-- Logout Button (Hidden by default) -->
            <button class="btn-blue" id="logoutBtn" onclick="logoutAdmin()" style="background:var(--danger); display:none;">🚪 Logout</button>
        </div>
    </div>

    <div id="adminPanel" class="no-print">
        <div class="admin-panel">
            <select id="inputMonth"></select>
            <input type="date" id="inputDate">
            <input type="text" id="name" placeholder="Full Name" list="nameList" oninput="autoFillDetails(this.value)">
            <datalist id="nameList"></datalist>
            <input type="number" id="oldR" placeholder="Old Reading">
            <input type="number" id="newR" placeholder="New Reading">
            <input type="number" id="balanceCarry" placeholder="Prev. Bill (+/-)">
            <button onclick="addRow()" class="btn-blue" style="background:var(--success);" id="addEntryBtn">+ Add Entry</button>
            <button onclick="downloadPDF()" class="btn-blue" style="background:var(--warning);" id="pdfBtn">📄 Save PDF</button>
            <button onclick="exportData()" class="btn-blue" style="background:#6554c0;" id="backupBtn">📥 Backup</button>
            <input type="file" id="importFile" style="display:none;" onchange="importData(event)">
            <button onclick="document.getElementById('importFile').click()" class="btn-blue" style="background:#42526e;" id="restoreBtn">📤 Restore</button>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="dataLoader">
        <div class="spinner"></div>
        <span id="loadingText">Fetching Cloud Data...</span>
    </div>

    <div id="pdfWrapper">
        <div id="tablesContainer"></div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-box">
            <h3 id="modalEditTitle">Update Record</h3>
            <p id="editInfo" style="font-size:12px; color:#829ab1; margin-top:0;"></p>
            <input type="hidden" id="editId">
            <input type="number" id="editPaid" class="modal-input" placeholder="Amount Received">
            <input type="number" id="editBalance" class="modal-input" placeholder="Edit Prev. Bill">
            <button onclick="saveEdit()" class="btn-blue" style="width:100%; background:var(--success); margin-top:10px; padding:10px;" id="modalSyncBtn">Sync Changes</button>
            <button onclick="closeModal('editModal')" style="background:none; border:none; color:var(--danger); width:100%; margin-top:5px; padding:10px; cursor:pointer; font-weight:600;" id="modalCancelBtn1">Cancel</button>
        </div>
    </div>

    <script>
        // AAPKI EMAIL YAHAN SET HAI 👇
        const ADMIN_EMAIL = "priyanshu25072007@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCoEyQf22lNxJLGPttZxjMiiu4OGQhXsZk",
            authDomain: "myelectricitybill-49244.firebaseapp.com",
            databaseURL: "https://myelectricitybill-49244-default-rtdb.firebaseio.com",
            projectId: "myelectricitybill-49244",
            storageBucket: "myelectricitybill-49244.firebasestorage.app",
            messagingSenderId: "343702698525",
            appId: "1:343702698525:web:2c46f3b5597bde55b4a4f4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let isAdmin = false, globalData = [];
        let currentLang = "en"; 

        // ----------------------------------------------------
        // FIREBASE AUTHENTICATION LOGIC
        // ----------------------------------------------------
        auth.onAuthStateChanged((user) => {
            if (user && user.email === ADMIN_EMAIL) {
                // Sahi user ne login kiya hai
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('loginBtn').style.display = 'none';
            } else {
                // Logged out hai ya galat email hai
                isAdmin = false;
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('loginBtn').style.display = 'inline-block';
                
                if (user && user.email !== ADMIN_EMAIL) {
                    alert((currentLang === "hi") ? "लॉगिन असफल: आप एडमिन नहीं हैं!" : "Access Denied: You are not the admin!");
                    auth.signOut(); // Galat user ko kick out kar do
                }
            }
            displayAllTables(globalData);
        });

        // Triggered by Login Button
        function triggerGoogleLogin() {
            if(!isAdmin) {
                auth.signInWithPopup(googleProvider).catch((error) => {
                    console.error("Login Error:", error);
                    alert("Login Failed: " + error.message);
                });
            }
        }

        function logoutAdmin() {
            auth.signOut().then(() => {
                alert((currentLang === "hi") ? "सफलतापूर्वक लॉगआउट हो गया।" : "Logged out successfully.");
            });
        }
        // ----------------------------------------------------

        db.ref('billingData').on('value', (snap) => {
            document.getElementById('dataLoader').style.display = 'none';
            globalData = snap.val() ? Object.values(snap.val()) : [];
            displayAllTables(globalData);
            updateNameSuggestions(globalData);
        });

        function setupYearMonth() {
            const select = document.getElementById('inputMonth');
            select.innerHTML = '';
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            [2026, 2027].forEach(y => months.forEach(m => {
                let opt = document.createElement('option'); 
                opt.value = `${m} ${y}`; 
                opt.innerHTML = `${m} ${y}`; 
                select.appendChild(opt);
            }));
        }

        function toggleLanguage() {
            currentLang = (currentLang === "en") ? "hi" : "en";
            
            if(currentLang === "hi") {
                document.getElementById('langBtn').innerText = "English";
                document.getElementById('syncText').innerText = " क्लाउड सुरक्षित";
                document.getElementById('themeBtn').innerText = "🌓 थीम";
                document.getElementById('historyBtn').innerText = "↺ इतिहास";
                if(document.getElementById('loginBtn')) document.getElementById('loginBtn').innerText = "🔒 लॉगिन";
                document.getElementById('logoutBtn').innerText = "🚪 लॉगआउट";
                document.getElementById('loadingText').innerText = "डेटा लोड हो रहा है...";
                
                document.getElementById('name').placeholder = "पूरा नाम दर्ज करें";
                document.getElementById('oldR').placeholder = "पुरानी रीडिंग";
                document.getElementById('newR').placeholder = "नई रीडिंग";
                document.getElementById('balanceCarry').placeholder = "पिछला बाकी/एडवांस (+/-)";
                document.getElementById('addEntryBtn').innerText = "+ नई एंट्री जोड़ें";
                document.getElementById('pdfBtn').innerText = "📄 पीडीएफ सेव करें";
                document.getElementById('backupBtn').innerText = "📥 बैकअप लें";
                document.getElementById('restoreBtn').innerText = "📤 रिस्टोर करें";
            } else {
                document.getElementById('langBtn').innerText = "हिंदी";
                document.getElementById('syncText').innerText = " Cloud Linked";
                document.getElementById('themeBtn').innerText = "🌓 Theme";
                document.getElementById('historyBtn').innerText = "↺ History";
                if(document.getElementById('loginBtn')) document.getElementById('loginBtn').innerText = "🔒 Login";
                document.getElementById('logoutBtn').innerText = "🚪 Logout";
                document.getElementById('loadingText').innerText = "Fetching Cloud Data...";
                
                document.getElementById('name').placeholder = "Full Name";
                document.getElementById('oldR').placeholder = "Old Reading";
                document.getElementById('newR').placeholder = "New Reading";
                document.getElementById('balanceCarry').placeholder = "Prev. Bill (+/-)";
                document.getElementById('addEntryBtn').innerText = "+ Add Entry";
                document.getElementById('pdfBtn').innerText = "📄 Save PDF";
                document.getElementById('backupBtn').innerText = "📥 Backup";
                document.getElementById('restoreBtn').innerText = "📤 Restore";
            }
            
            displayAllTables(globalData);
        }

        function displayAllTables(data) {
            const container = document.getElementById('tablesContainer');
            container.innerHTML = '';
            const monthsOrder = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const sortedMonths = [...new Set(data.map(i => i.month))].sort((a,b) => {
                const [m1, y1] = a.split(" "), [m2, y2] = b.split(" ");
                return y2 !== y1 ? y2 - y1 : monthsOrder.indexOf(m2) - monthsOrder.indexOf(m1);
            });

            const labels = {
                en: { name: "Name", reading: "Reading", units: "Units", curBill: "Current Bill", prevBill: "Prev. Bill", totalBill: "Total Bill", received: "Received", status: "Status", rem: "Rem", adv: "Adv", settled: "Settled", paid: "PAID", unpaid: "UNPAID", partial: "PARTIAL", action: "Action" },
                hi: { name: "नाम", reading: "रीडिंग", units: "खपत", curBill: "वर्त्तमान bill", prevBill: "पुराना बिल", totalBill: "कुल बिल", received: "प्राप्त", status: "स्थिति", rem: "बकाया", adv: "अधिक", settled: "बराबर", paid: "चुक्ता", unpaid: "बाकी", partial: "आंशिक", action: "एक्शन" }
            }[currentLang];

            sortedMonths.forEach(month => {
                const monthData = data.filter(i => i.month === month);
                const tableDate = monthData[0].date ? monthData[0].date.split('-').reverse().join('/') : "";

                let html = `<div class="bill-container">
                    <div class="month-header">
                        <h2>${month}</h2>
                        <div class="month-date-sub">${tableDate}</div>
                    </div>
                    <div class="table-wrapper"><table><thead><tr>
                        <th style="width:16%">${labels.name}</th>
                        <th style="width:15%">${labels.reading}</th>
                        <th style="width:7%">${labels.units}</th>
                        <th style="width:12%">${labels.curBill}</th>
                        <th style="width:10%">${labels.prevBill}</th>
                        <th style="width:12%">${labels.totalBill}</th>
                        <th style="width:14%">${labels.received}</th>
                        <th style="width:10%">${labels.status}</th>
                        ${isAdmin ? `<th class="no-print" style="width:10%; text-align:center;">${labels.action}</th>` : ''}
                    </tr></thead><tbody>`;

                monthData.forEach(item => {
                    const units = item.newR - item.oldR, current = units * 10, prev = item.bal || 0, total = current + prev, received = item.paid || 0, diff = total - received;
                    
                    let extra = diff > 0 ? `<span class="sub-text" style="color:var(--danger);">${labels.rem}: ₹${diff}</span>` : (diff < 0 ? `<span class="sub-text" style="color:var(--accent);">${labels.adv}: ₹${Math.abs(diff)}</span>` : `<span class="sub-text" style="color:#829ab1;">${labels.settled}</span>`);
                    
                    let statusText = labels.unpaid;
                    let statusClass = "status-unpaid";
                    if(item.status === 'PAID') { statusText = labels.paid; statusClass = "status-paid"; }
                    else if(item.status === 'PARTIAL') { statusText = labels.partial; statusClass = "status-partial"; }

                    html += `<tr>
                        <td><b style="color:var(--text-header);">${item.name}</b></td>
                        <td style="color:#627d98; white-space: nowrap;">${item.oldR} <span style="font-size:10px;">→</span> ${item.newR}</td>
                        <td style="font-weight:600;">${units}</td>
                        <td style="color:var(--accent); font-weight:700;">₹${current}</td>
                        <td style="color:${prev >= 0 ? 'var(--warning)' : 'var(--success)'}; font-weight:600;">${prev >= 0 ? '+' : ''}${prev}</td>
                        <td style="font-weight:700; font-size:14px;">₹${total}</td>
                        <td><b style="color:var(--success);">₹${received}</b>${extra}</td>
                        <td><span class="status-pill ${statusClass}">${statusText}</span></td>
                        ${isAdmin ? `<td class="no-print">
                            <div class="action-btns">
                                <button class="btn-icon" onclick="openEdit(${item.id})" style="background:var(--warning);">${currentLang === "hi" ? "बदलें" : "Edit"}</button> 
                                <button class="btn-icon" onclick="deleteRow(${item.id})" style="background:var(--danger);">${currentLang === "hi" ? "हटाएं" : "Del"}</button>
                            </div>
                        </td>` : ''}
                    </tr>`;
                });
                container.innerHTML += html + `</tbody></table></div></div>`;
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfWrapper');
            const noPrintElements = document.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');

            const opt = {
                margin: [10, 5, 10, 5],
                filename: 'Electricity_Bills_2026.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                noPrintElements.forEach(el => {
                    if(el.tagName === 'TH' || el.tagName === 'TD') el.style.display = 'table-cell';
                    else if(el.id === 'adminPanel' && isAdmin) el.style.display = 'block';
                    else if(el.className.includes('nav-container')) el.style.display = 'flex';
                    else el.style.display = 'block';
                });
            });
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const msg = (currentLang === "hi") ? `क्या आप ${data.length} रिकॉर्ड रिस्टोर करना चाहते हैं?` : `Restore ${data.length} records?`;
                    if (confirm(msg)) {
                        data.forEach(item => db.ref('billingData/' + item.id).set(item));
                        alert((currentLang === "hi") ? "डाटा रिस्टोर हो गया!" : "Done!");
                    }
                } catch (err) { alert((currentLang === "hi") ? "फॉर्मेट गलत है!" : "Format Error!"); }
            };
            reader.readAsText(file);
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(globalData)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Cloud_Backup.json`; a.click();
        }

        function addRow() {
            const entry = { id: Date.now(), month: document.getElementById('inputMonth').value, date: document.getElementById('inputDate').value, name: document.getElementById('name').value, oldR: parseInt(document.getElementById('oldR').value) || 0, newR: parseInt(document.getElementById('newR').value) || 0, bal: parseInt(document.getElementById('balanceCarry').value) || 0, paid: 0, status: "NOT PAID" };
            if(!entry.name) return alert((currentLang === "hi") ? "नाम डालना अनिवार्य है!" : "Name required!");
            db.ref('billingData/' + entry.id).set(entry);
            document.getElementById('name').value = ''; document.getElementById('newR').value = ''; document.getElementById('balanceCarry').value = '';
        }

        function saveEdit() {
            const id = document.getElementById('editId').value;
            const paid = parseInt(document.getElementById('editPaid').value) || 0;
            const bal = parseInt(document.getElementById('editBalance').value) || 0;

            const editedItem = globalData.find(i => i.id == id);
            if (!editedItem) return;

            const userName = editedItem.name;
            const currentTotal = ((editedItem.newR - editedItem.oldR) * 10) + bal;
            const currentStatus = (paid >= currentTotal) ? "PAID" : (paid > 0 ? "PARTIAL" : "NOT PAID");

            let updates = {};
            
            updates['billingData/' + id + '/paid'] = paid;
            updates['billingData/' + id + '/bal'] = bal;
            updates['billingData/' + id + '/status'] = currentStatus;

            const userRecords = globalData.filter(i => i.name === userName).sort((a, b) => a.id - b.id);

            let previousLeftover = currentTotal - paid;
            let startUpdatingNext = false;

            for (let i = 0; i < userRecords.length; i++) {
                let record = userRecords[i];

                if (startUpdatingNext) {
                    let newBal = previousLeftover;
                    let recordTotal = ((record.newR - record.oldR) * 10) + newBal;
                    let recordStatus = ((record.paid || 0) >= recordTotal) ? "PAID" : ((record.paid || 0) > 0 ? "PARTIAL" : "NOT PAID");

                    updates['billingData/' + record.id + '/bal'] = newBal;
                    updates['billingData/' + record.id + '/status'] = recordStatus;

                    previousLeftover = recordTotal - (record.paid || 0);
                }

                if (record.id == id) {
                    startUpdatingNext = true;
                }
            }

            db.ref().update(updates).then(() => {
                closeModal('editModal');
            }).catch(error => {
                alert("Update failed: " + error);
            });
        }

        function deleteRow(id) { 
            const msg = (currentLang === "hi") ? "क्या आप इस रिकॉर्ड को हटाना चाहते हैं?" : "Delete record?";
            if(confirm(msg)) db.ref('billingData/' + id).remove(); 
        }
        
        function closeModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }
        
        function openEdit(id) {
            const item = globalData.find(i => i.id == id);
            document.getElementById('editId').value = id; 
            document.getElementById('editPaid').value = item.paid; 
            document.getElementById('editBalance').value = item.bal; 
            document.getElementById('editInfo').innerText = (currentLang === "hi") ? `नाम: ${item.name}` : `Record: ${item.name}`; 
            
            const modal = document.getElementById('editModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        
        function toggleTheme() { document.body.getAttribute('data-theme')==='dark'?document.body.removeAttribute('data-theme'):document.body.setAttribute('data-theme','dark'); }
        
        function autoFillDetails(val) {
            const records = globalData.filter(i => i.name === val).sort((a,b) => b.id - a.id);
            if(records.length > 0) {
                document.getElementById('oldR').value = records[0].newR;
                document.getElementById('balanceCarry').value = ((records[0].newR - records[0].oldR) * 10) + records[0].bal - records[0].paid;
            }
        }
        function updateNameSuggestions(data) {
            const list = document.getElementById('nameList'); list.innerHTML = '';
            [...new Set(data.map(i => i.name))].forEach(n => { let o = document.createElement('option'); o.value = n; list.appendChild(o); });
        }
    </script>
</body>
</html>
